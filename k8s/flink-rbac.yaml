---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: flink

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink-native
  namespace: flink
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - configmaps
      - events
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
      - patch

  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - delete
      - update
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-native
  namespace: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: flink
roleRef:
  kind: Role
  name: flink-native
  apiGroup: rbac.authorization.k8s.io